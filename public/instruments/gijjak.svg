<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- G'ijjak Instrument (Left side) -->
  
  <!-- Spike (Foot) -->
  <line x1="40" y1="88" x2="40" y2="98" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <circle cx="40" cy="98" r="2" fill="#f59e0b" />

  <!-- Round Body (Bowl) -->
  <circle cx="40" cy="70" r="18" stroke="#f59e0b" stroke-width="3" fill="#000000" fill-opacity="0.2" />
  <circle cx="40" cy="70" r="15" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Neck -->
  <rect x="37" y="25" width="6" height="28" fill="#f59e0b" opacity="0.8" />
  <rect x="37" y="25" width="6" height="28" stroke="#f59e0b" stroke-width="1" />

  <!-- Headstock -->
  <path d="M36 25 L 36 5 L 44 5 L 44 25" stroke="#f59e0b" stroke-width="2" fill="none" />
  
  <!-- 4 Tuning Pegs (Large and distinct) -->
  <!-- Left side pegs -->
  <line x1="36" y1="10" x2="30" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="30" cy="10" r="1.5" fill="#f59e0b" />
  <line x1="36" y1="18" x2="30" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="30" cy="18" r="1.5" fill="#f59e0b" />
  
  <!-- Right side pegs -->
  <line x1="44" y1="10" x2="50" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="10" r="1.5" fill="#f59e0b" />
  <line x1="44" y1="18" x2="50" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="18" r="1.5" fill="#f59e0b" />

  <!-- Bridge (diagonal) -->
  <path d="M36 75 L 44 72" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Strings -->
  <line x1="39" y1="5" x2="39" y2="73" stroke="#f59e0b" stroke-width="0.5" />
  <line x1="41" y1="5" x2="41" y2="73" stroke="#f59e0b" stroke-width="0.5" />

  <!-- Tailpiece connection -->
  <path d="M40 88 L 40 78" stroke="#f59e0b" stroke-width="2" />


  <!-- Bow (Kamon) - Right side -->
  <!-- Stick -->
  <path d="M70 10 Q 80 50 70 90" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Hair -->
  <line x1="70" y1="12" x2="70" y2="88" stroke="#f59e0b" stroke-width="1" stroke-dasharray="40 0" opacity="0.8" />
  <!-- Frog/Handle at bottom -->
  <rect x="68" y="85" width="4" height="6" fill="#f59e0b" />

</svg>
